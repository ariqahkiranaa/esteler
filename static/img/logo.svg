<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c70289"/>
      <stop offset="50%" stop-color="#7b1fa2"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="straw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#grad)" />
  
  <!-- Cup Straw (Diagonal) -->
  <line x1="68" y1="18" x2="48" y2="48" stroke="url(#straw)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Cup Rim -->
  <path d="M26 44 Q50 49 74 44" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Cup Body -->
  <path d="M28 46 L35 78 Q36 82 40 82 L60 82 Q64 82 65 78 L72 46" fill="rgba(255,255,255,0.22)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Ice cubes / Bubbles -->
  <circle cx="44" cy="60" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="56" cy="66" r="3.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="50" cy="72" r="2.5" fill="#ffffff" opacity="0.6"/>
  <path d="M40 50 Q50 56 60 50" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
