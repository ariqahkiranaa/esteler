<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Sistem Informasi Penjualan Es Teler</title>
  
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <style>
    body {
      background: linear-gradient(135deg, #c70289 0%, #a10394 50%, #a010b9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-header {
      background: linear-gradient(180deg, #F0F9FF 0%, #FFFFFF 100%);
      padding: 2.25rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #E2E8F0;
    }
    .brand-avatar {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #c002c7 0%, #10B981 100%);
      color: #FFFFFF;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2.2rem;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
    }
    .login-body {
      padding: 2rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #CBD5E1;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #0284C7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #c7027b 0%, #a1037f 100%);
      color: #FFFFFF;
      border: none;
      padding: 0.8rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0369A1 0%, #024b75 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.4);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-avatar">
        <i class="bi bi-cup-straw"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">KEDAI UNIK </h4>
      <p class="text-muted small mb-0">Sistem Informasi Penjualan &amp; Kasir (POS)</p>
    </div>

    <div class="login-body">
      <!-- Flash Alert Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show p-2 px-3 small border-0" role="alert">
              <i class="bi bi-exclamation-circle-fill me-1"></i> {{ message }}
              <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
<form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
              <i class="bi bi-person text-primary"></i>
            </span>
            <input type="text" name="username_or_email" class="form-control border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="Masukkan username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
              <i class="bi bi-lock text-primary"></i>
            </span>
            <input type="password" id="inputPassword" name="password" class="form-control border-start-0 border-end-0" placeholder="Masukkan password" required>
            <button class="btn btn-light border border-start-0 text-muted" type="button" style="border-radius: 0 12px 12px 0;" onclick="togglePasswordVisibility()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Dashboard
        </button>
      </form>
    </div>

    <div class="bg-light py-2 text-center border-top">
      <small class="text-muted" style="font-size: 0.75rem;">&copy; 2026 KEDAI UNIK. All rights reserved.</small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('inputPassword');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
  </script>
</body>
</html>
